services:
  web:
    build:
      context: .
      # All three are baked into the bundle at BUILD time — a container restart
      # never picks up a change, only `docker compose build`.
      #
      # Values come from a `.env` file sitting next to this compose file on the
      # server (git-ignored, and excluded from the image by .dockerignore).
      # The defaults after `:-` are what production should use, so a missing
      # .env still builds correctly.
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://api.kratos-energy.com/api/v1}
        # Canonical origin. Anything but the production URL makes the build
        # non-indexable (robots.txt serves "Disallow: /").
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://kratos-energy.com}
        # Search Console token — the content value only, not the whole meta tag.
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        # GTM container ID. Note the single `-`, not `:-` like the others: it
        # substitutes the default only when the var is UNSET, so staging can set
        # an empty NEXT_PUBLIC_GTM_ID= to build with no tag manager.
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID-GTM-5RR9ZRTC}
        # Meta Pixel ID. Single `-` for the same reason as GTM above.
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID-1654900768199262}
    image: kratos-energy
    container_name: kratos-energy
    restart: unless-stopped
    # Host 3006 -> container 3000. Nginx proxies kratos-energy.com to 127.0.0.1:3006.
    ports:
      - "127.0.0.1:3006:3000"
